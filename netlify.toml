[build]
  command = "PORT=5173 BASE_PATH=/ pnpm --filter @workspace/samen-pc-portfolio build"
  publish = "artifacts/samen-pc-portfolio/dist/public"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
